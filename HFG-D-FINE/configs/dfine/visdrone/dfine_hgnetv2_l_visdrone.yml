__include__: [
  '../../dataset/visdrone_detection.yml',
  '../../runtime.yml',
  '../include/dataloader.yml',
  '../include/optimizer.yml',
  '../include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_l_visdrone


# HGNetv2:
#   name: "B4"
#   return_idx: [1, 2, 3]
#   freeze_stem_only: True
#   freeze_at: 0
#   freeze_norm: True

HGNetv2:
  name: "B4"
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0000125 # 0.0000125
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.00025 #  0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125


# Increase to search for the optimal ema
epoches: 190 # 72 + 2n
train_dataloader:
  total_batch_size: 16
  dataset:
    transforms:
      policy:
        epoch: 182
  collate_fn:
    stop_epoch: 182
    ema_restart_decay: 0.9999
    base_size_repeat: 4

val_dataloader:
  total_batch_size: 32
